[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "watch-engine"
version = "0.2.0"
description = "Reusable condition-watch runtime with durable observations and event delivery"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "watch-engine contributors" }]
dependencies = [
  "croniter>=2.0,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "jsonschema>=4.23,<5",
  "mypy>=1.11,<3",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "rfc3339-validator>=0.1.4,<1",
  "ruff>=0.9,<1",
  "setuptools>=83",
  "twine>=6,<8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
watch_engine = ["py.typed", "schemas/*.json"]

[project.urls]
Homepage = "https://github.com/kongbu0621/watch-engine"
Documentation = "https://github.com/kongbu0621/watch-engine#readme"
Issues = "https://github.com/kongbu0621/watch-engine/issues"
Security = "https://github.com/kongbu0621/watch-engine/security/policy"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["watch_engine"]

[[tool.mypy.overrides]]
module = "croniter.*"
ignore_missing_imports = true
